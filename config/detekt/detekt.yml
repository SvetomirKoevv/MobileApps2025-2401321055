# Only overrides; everything else uses detekt's default rules (buildUponDefaultConfig = true).

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Allows colour constants such as val Purple80 = Color(0xFFD0BCFF)
    ignorePropertyDeclaration: true
    # UI sizes such as 16.dp inside composables are not magic numbers
    ignoreAnnotated: ['Preview', 'Composable']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
